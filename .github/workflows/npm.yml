on:
  push:
    branches:
      - master
permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing.
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - run: npm ci
      - run: npm test

      - uses: JS-DevTools/npm-publish@v4.1.5
